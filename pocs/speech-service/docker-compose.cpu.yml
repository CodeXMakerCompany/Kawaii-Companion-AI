version: "3.8"

services:
  speech-service:
    build:
      context: ../..
      dockerfile: pocs/speech-service/Dockerfile
    container_name: pneuma-speech-service
    ports:
      - "8001:8001"
    environment:
      - FORCE_CPU=1 # Force CPU mode
    volumes:
      - speech-outputs:/tmp/speech_outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  speech-outputs:
