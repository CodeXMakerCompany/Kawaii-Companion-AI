<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CODEXMAKER ASSISTANT</title>
    <link rel="stylesheet" href="renderer/styles.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        color: #e0e0e0;
        min-height: 100vh;
        overflow: hidden;
      }
      #status {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1;
        padding: 6px 12px;
        font-family: monospace;
        font-size: 12px;
        background: rgba(42, 42, 42, 0.9);
      }
      /* Force canvas to be transparent and fill window */
      canvas {
        background: transparent !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        display: block !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Transparent WebGL: force alpha channel + clear to transparent so only the waifu is visible. -->
    <script>
      (function () {
        console.log("Patching WebGL for transparency...");

        // 1) Force WebGL context to have alpha channel
        var getContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function (contextType, attributes) {
          if (
            contextType === "webgl" ||
            contextType === "experimental-webgl" ||
            contextType === "webgl2"
          ) {
            attributes = attributes || {};
            attributes.alpha = true;
            attributes.premultipliedAlpha = false;
            console.log("WebGL context created with alpha");
          }
          return getContext.call(this, contextType, attributes);
        };

        // 2) Patch clearColor AND clear to force transparency
        function patchClearColor(proto) {
          if (!proto || proto._clearColorPatched) return;

          var origClearColor = proto.clearColor;
          var origClear = proto.clear;

          // Override clearColor to always use transparent
          proto.clearColor = function (r, g, b, a) {
            origClearColor.call(this, 0, 0, 0, 0);
          };

          // Override clear to set transparent color first
          proto.clear = function (mask) {
            origClearColor.call(this, 0, 0, 0, 0);
            return origClear.call(this, mask);
          };

          proto._clearColorPatched = true;
          console.log("Patched WebGL clear functions");
        }

        if (typeof WebGLRenderingContext !== "undefined")
          patchClearColor(WebGLRenderingContext.prototype);
        if (typeof WebGL2RenderingContext !== "undefined")
          patchClearColor(WebGL2RenderingContext.prototype);

        var canvas = document.createElement("canvas");
        var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (gl && !gl.constructor.prototype._clearColorPatched)
          patchClearColor(gl.constructor.prototype);

        console.log("WebGL patching complete");
      })();
    </script>
    <!-- Configure Live2D paths BEFORE loading the library -->
    <!-- Configure Live2D paths BEFORE loading the library -->
    <script>
      // This will be read by our renderer to configure the model
      window.__LAPP_MODEL_OVERRIDE__ = {
        enabled: true,
        baseUrl: "models/SharkGirl/",
        modelName: "SharkGirl",
      };
      console.log("Live2D model override configured");
    </script>
    <!-- Load SDK first (sync) so LAppDelegate exists when the renderer runs. Then the renderer module. -->
    <script src="libs/live2dcubismcore.min.js"></script>
    <script src="libs/lapp.min.js"></script>
    <script type="module" src="renderer/index.js"></script>
  </body>
</html>
